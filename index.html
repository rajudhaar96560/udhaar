<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050a1c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>उधार मैनेजर – AI बेकाबू टीम</title>
<style>
:root{--bg:#050a1c;--card:#0d1630;--line:#1e2d5a;--tx:#f1f4ff;--mu:#8e9acb;--red:#ff4d6d;--grn:#22c55e;--cy:#22d3ee;--g:linear-gradient(135deg,#3b82f6,#8b5cf6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:480px;padding:16px;min-height:100vh}
.scr{display:none}.scr.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.btn{border:0;border-radius:14px;padding:14px;font:600 15px inherit;font-family:inherit;color:#fff;background:var(--g);width:100%;cursor:pointer}
.btn.grn{background:linear-gradient(135deg,#16a34a,#22c55e)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mu)}
input{width:100%;background:#091024;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:15px inherit;font-family:inherit;margin-top:8px}
.mu{color:var(--mu);font-size:13px}
/* splash */
#splash{min-height:calc(100vh - 32px);flex-direction:column;justify-content:space-between;gap:24px}
#splash.on{display:flex}
.logo{text-align:center;padding:36px 10px;background:radial-gradient(circle at 50% 30%,#14234f,#050a1c 70%);border-radius:20px}
.logo .s{font:900 84px/1 Georgia,serif;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #3b82f6aa)}
.logo .bt{font:800 38px/1 sans-serif;letter-spacing:4px;margin-top:6px}
.logo .n{font-size:22px;font-weight:700;margin-top:6px}.logo .n b{color:var(--cy)}
.logo .t{font-size:11px;letter-spacing:3px;color:var(--mu);margin-top:8px}
.tag{text-align:center;font-size:20px;font-weight:700;line-height:1.6}
/* list */
.hd{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.mini{width:40px;height:40px;border-radius:10px;background:var(--g);display:grid;place-items:center;font:900 22px Georgia,serif}
.hd h1{font-size:19px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stats b{font-size:24px;display:block;margin-top:2px}
h2{font-size:16px;margin:14px 0 10px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.row .i{flex:1;min-width:0}.row .i b{display:block}
.amt{font-weight:800;font-size:17px}.red{color:var(--red)}.grn{color:var(--grn)}
/* detail */
.back{background:none;border:0;color:var(--cy);font:14px inherit;font-family:inherit;padding:6px 0;cursor:pointer}
.prof{text-align:center;margin:8px 0 12px}.prof .av{width:76px;height:76px;font-size:32px;margin:0 auto 8px}
.bar{height:8px;border-radius:8px;background:#16224a;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee);transition:width .4s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ent{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border:0}
.ent button{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px;cursor:pointer}
.sum{display:flex;justify-content:space-between;padding:8px 0}
/* sheet */
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.on{display:flex}
#sh{background:#0a1228;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sh h3{margin-bottom:6px}#sh .btn{margin-top:14px}
</style>
</head>
<body>
<div id="app">
 <section class="scr on" id="splash">
  <div class="logo"><div class="s">S</div><div class="bt">BT</div><div class="n"><b>AI</b> बेकाबू टीम</div><div class="t">Think | Build | Grow</div></div>
  <div class="tag">बड़े सपने…<br>अब हकीकत बनेंगे!</div>
  <button class="btn" id="go">Get Started →</button>
 </section>

 <section class="scr" id="list">
  <div class="hd"><div class="mini">S</div><div><h1>उधार मैनेजर</h1><div class="mu">AI बेकाबू टीम</div></div></div>
  <input id="q" placeholder="🔍 नाम से खोजें…">
  <div class="stats"><div class="card"><span class="mu">कुल बाकी उधार</span><b class="red" id="tot"></b></div><div class="card"><span class="mu">कुल लोग</span><b style="color:var(--cy)" id="cnt"></b></div></div>
  <h2>ये वे लोग हैं जिन्होंने आपसे उधार लिया है</h2>
  <div id="rows"></div>
  <button class="btn" id="addp">+ नया व्यक्ति जोड़ें</button>
 </section>

 <section class="scr" id="det">
  <button class="back" id="bk">← वापस</button>
  <div class="card prof"><div class="av" id="dav"></div><b style="font-size:20px" id="dn"></b><div class="mu" id="dp"></div></div>
  <div class="two"><div class="card"><span class="mu">कुल उधार दिया</span><b style="font-size:22px;display:block" id="dl"></b></div><div class="card"><span class="mu">अब तक चुकाया</span><b class="grn" style="font-size:22px;display:block" id="dpd"></b></div></div>
  <div class="card"><span class="mu">चुकौती प्रगति</span><div class="bar"><i id="pb"></i></div><span class="mu" id="pt"></span></div>
  <div class="two"><button class="btn" id="bl">+ उधार दिया</button><button class="btn grn" id="bp">+ पैसे मिले</button></div>
  <h2>हिसाब-किताब</h2>
  <div class="card" id="ents"></div>
  <h2>कुल गणना</h2>
  <div class="card"><div class="sum"><span>कुल उधार</span><b id="s1"></b></div><div class="sum"><span>कुल चुकाया</span><b id="s2" class="grn"></b></div><div class="sum"><span>बाकी</span><b id="s3" class="red"></b></div></div>
  <button class="btn ghost" id="del" style="margin-top:14px">इस व्यक्ति को हटाएँ</button>
 </section>
</div>
<div id="ov"><div id="sh"></div></div>

<script>
var KEY="udhaar-manager-v1",M=["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
var seed=[
{id:1,n:"राहुल शर्मा",p:"98765 43210",e:[{t:"l",a:3000,d:"2025-04-02"}]},
{id:2,n:"प्रिया वर्मा",p:"91234 56780",e:[{t:"l",a:2000,d:"2025-02-10"},{t:"p",a:2000,d:"2025-03-05"}]},
{id:3,n:"अमन खान",p:"99887 76655",e:[{t:"l",a:8000,d:"2025-02-15"},{t:"p",a:2000,d:"2025-03-01"},{t:"p",a:2500,d:"2025-04-09"}]},
{id:4,n:"नेहा सिंह",p:"90909 80808",e:[{t:"l",a:3500,d:"2025-03-20"}]}];
var D,cur=null;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.length)D=seed;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function inr(n){return "₹"+Number(n).toLocaleString("en-IN")}
function sums(x){var l=0,p=0;x.e.forEach(function(e){e.t=="l"?l+=e.a:p+=e.a});return{l:l,p:p,b:l-p}}
function fd(s){var a=s.split("-");return +a[2]+" "+M[+a[1]-1]+" "+a[0]}
function show(id){document.querySelectorAll(".scr").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on");scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderList(){
 var q=$("q").value.trim().toLowerCase(),t=0;
 D.forEach(function(x){t+=Math.max(0,sums(x).b)});
 $("tot").textContent=inr(t);$("cnt").textContent=D.length;
 var h="";
 D.filter(function(x){return !q||x.n.toLowerCase().indexOf(q)>-1||x.p.replace(/\s/g,"").indexOf(q)>-1}).forEach(function(x){
  var b=sums(x).b;
  h+='<div class="card row" data-id="'+x.id+'"><div class="av">'+esc(x.n.charAt(0))+'</div><div class="i"><b>'+esc(x.n)+'</b><span class="mu">'+esc(x.p)+'</span></div><span class="amt '+(b>0?"red":"grn")+'">'+inr(Math.max(0,b))+'</span></div>';
 });
 $("rows").innerHTML=h||'<p class="mu" style="text-align:center;padding:20px">कोई नहीं मिला। नया व्यक्ति जोड़ें।</p>';
}
function renderDet(){
 var x=D.find(function(y){return y.id==cur});if(!x){show("list");return}
 var s=sums(x),pc=s.l?Math.min(100,Math.round(s.p*100/s.l)):0;
 $("dav").textContent=x.n.charAt(0);$("dn").textContent=x.n;$("dp").textContent="📞 "+x.p;
 $("dl").textContent=inr(s.l);$("dpd").textContent=inr(s.p);
 $("pb").style.width=pc+"%";$("pt").textContent=pc+"% चुकाया गया";
 $("s1").textContent=inr(s.l);$("s2").textContent=inr(s.p);$("s3").textContent=inr(Math.max(0,s.b));
 var h="";
 x.e.map(function(e,i){return{e:e,i:i}}).sort(function(a,b){return a.e.d<b.e.d?1:-1}).forEach(function(o){
  h+='<div class="ent"><div><b>'+(o.e.t=="l"?"उधार दिया":"पैसे मिले")+'</b><div class="mu">'+fd(o.e.d)+(o.e.note?" · "+esc(o.e.note):"")+'</div></div><div><b class="'+(o.e.t=="l"?"red":"grn")+'">'+(o.e.t=="l"?"+":"−")+inr(o.e.a)+'</b><button data-del="'+o.i+'" aria-label="हटाएँ">✕</button></div></div>';
 });
 $("ents").innerHTML=h||'<p class="mu">अभी कोई लेन-देन नहीं।</p>';
}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function sheet(html){$("sh").innerHTML=html;$("ov").classList.add("on")}
function close_(){$("ov").classList.remove("on")}
function entrySheet(t){
 sheet('<h3>'+(t=="l"?"उधार दिया":"पैसे मिले")+'</h3><input id="ea" type="number" inputmode="numeric" placeholder="रकम (₹)"><input id="ed" type="date" value="'+today()+'"><input id="en" placeholder="नोट (वैकल्पिक)"><button class="btn '+(t=="p"?"grn":"")+'" id="ok">सेव करें</button><button class="btn ghost" id="no" style="margin-top:8px">रद्द करें</button>');
 $("ea").focus();
 $("ok").onclick=function(){
  var a=parseFloat($("ea").value);if(!(a>0)){$("ea").style.borderColor="var(--red)";return}
  var x=D.find(function(y){return y.id==cur});
  x.e.push({t:t,a:a,d:$("ed").value||today(),note:$("en").value.trim()});save();close_();renderDet();
 };$("no").onclick=close_;
}
$("go").onclick=function(){renderList();show("list")};
$("q").oninput=renderList;
$("rows").onclick=function(e){var r=e.target.closest(".row");if(r){cur=r.dataset.id;renderDet();show("det")}};
$("bk").onclick=function(){renderList();show("list")};
$("bl").onclick=function(){entrySheet("l")};
$("bp").onclick=function(){entrySheet("p")};
$("ents").onclick=function(e){var i=e.target.dataset.del;if(i==null)return;
 sheet('<h3>यह एंट्री हटाएँ?</h3><button class="btn" id="ok" style="background:var(--red)">हाँ, हटाएँ</button><button class="btn ghost" id="no" style="margin-top:8px">रद्द करें</button>');
 $("ok").onclick=function(){D.find(function(y){return y.id==cur}).e.splice(+i,1);save();close_();renderDet()};$("no").onclick=close_};
$("addp").onclick=function(){
 sheet('<h3>नया व्यक्ति जोड़ें</h3><input id="pn" placeholder="नाम"><input id="pp" type="tel" inputmode="tel" placeholder="फ़ोन नंबर"><button class="btn" id="ok">जोड़ें</button><button class="btn ghost" id="no" style="margin-top:8px">रद्द करें</button>');
 $("pn").focus();
 $("ok").onclick=function(){var n=$("pn").value.trim();if(!n){$("pn").style.borderColor="var(--red)";return}
  D.push({id:Date.now(),n:n,p:$("pp").value.trim()||"—",e:[]});save();close_();renderList()};$("no").onclick=close_};
$("del").onclick=function(){
 sheet('<h3>इस व्यक्ति को हटाएँ?</h3><p class="mu">सारा हिसाब भी हट जाएगा।</p><button class="btn" id="ok" style="background:var(--red)">हाँ, हटाएँ</button><button class="btn ghost" id="no" style="margin-top:8px">रद्द करें</button>');
 $("ok").onclick=function(){D=D.filter(function(y){return y.id!=cur});save();close_();renderList();show("list")};$("no").onclick=close_};
$("ov").onclick=function(e){if(e.target==$("ov"))close_()};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
