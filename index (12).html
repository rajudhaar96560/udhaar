function vReg(){
 var R=dayRows(cd),w=DN[new Date(cd+'T00:00:00').getDay()];
 return'<div class="dt"><button aria-label="'+TR('पिछला दिन')+'" onclick="cd=shift(cd,-1);render()">‹</button><label><input type="date" value="'+cd+'" onchange="if(this.value){cd=this.value;render()}" aria-label="'+TR('तारीख़')+'"><small>'+w+'</small></label><button aria-label="'+TR('अगला दिन')+'" onclick="cd=shift(cd,1);render()">›</button></div>'+
 '<div id="fin"></div><button class="add" onclick="openRow()">+ '+TR('नई एंट्री (डिस्प्ले बदली)')+'</button>'+
 '<h2>'+TR('आज की एंट्री')+'</h2>'+(R.length?R.map(function(r,i){var k=calc(r);return'<button class="ent" onclick="openRow('+r.id+')"><span class="n">'+(i+1)+'</span><span class="b"><span class="m">'+esc(r.m||'—')+'</span><span class="g"><span>'+TR('लाए')+' '+inr(r.cost)+'</span><span>'+TR('बेची')+' '+inr(r.sale)+'</span>'+(r.svc?'<span>'+TR('सर्विस')+' '+inr(r.svc)+'</span>':'')+'</span></span><span class="r"><b>'+inr(k.t)+'</b><span class="'+cl(k.p)+'">'+TR('मुनाफ़ा')+' '+inr(k.p)+'</span></span></button>'}).join(''):'<div class="card mu">'+TR('अभी कोई एंट्री नहीं है। ऊपर के नीले बटन से पहली डिस्प्ले की एंट्री कीजिए।')+'</div>')+
 '<div id="sm"></div>'}
function drawSm(){
 var s=dsum(cd),e=S.exp[cd]||{},f=$('fin'),m=$('sm');if(!f||!m)return;
 f.innerHTML=s.n||s.x?'<div class="fin '+(s.net>=0?'p':'l')+'"><small>'+TR('फ़ाइनल नेट प्रॉफ़िट (मुनाफ़ा − ख़र्च)')+'</small><b>'+inr(s.net)+'</b><span>'+(s.net>=0?''+TR('आज आपको')+' '+inr(s.net)+' '+TR('का प्रॉफ़िट हुआ')+'':''+TR('आज')+' '+inr(-s.net)+' '+TR('का नुक़सान हुआ')+'')+'</span></div>':'<div class="fin z"><small>'+TR('फ़ाइनल नेट प्रॉफ़िट')+'</small><b>₹0</b><span class="mu">'+TR('एंट्री करते ही यहाँ अपने-आप आ जाएगा')+'</span></div>';
 var X=[['rent',''+TR('किराया (')+'Rent)'],['elec',''+TR('बिजली (')+'Electricity)'],['tools',''+TR('औज़ार / पार्ट्स (')+'Tools / Parts)'],['other',''+TR('दूसरा ख़र्च (')+'Other)']];
 m.innerHTML='<h2>'+TR('रोज़ का सारांश (')+'Daily Summary)</h2><div class="card"><div class="sr"><span>'+TR('कुल डिस्प्ले लागत')+'</span><b>'+inr(s.c)+'</b></div><div class="sr"><span>'+TR('कुल सर्विस चार्ज')+'</span><b>'+inr(s.s)+'</b></div><div class="sr"><span>'+TR('कुल बिक्री (')+'Total Sales)</span><b>'+inr(s.t)+'</b></div><div class="sr"><span>'+TR('कुल मुनाफ़ा')+'</span><b class="'+cl(s.p)+'">'+inr(s.p)+'</b></div></div>'+
 '<h2>'+TR('रोज़ का ख़र्च (')+'Daily Expenses)</h2><div class="card">'+X.map(function(x){return'<div class="xr"><label for="x'+x[0]+'">'+x[1]+'</label><input id="x'+x[0]+'" type="number" inputmode="decimal" min="0" value="'+(e[x[0]]||'')+'" placeholder="0" oninput="setExp(\''+x[0]+'\',this.value)"></div>'}).join('')+'<div class="sr"><span>'+TR('कुल ख़र्च')+'</span><b>'+inr(s.x)+'</b></div></div>'+
 '<a class="btn wa" target="_blank" rel="noopener" href="'+waLink(s)+'">WhatsApp '+TR('पर आज का हिसाब भेजें')+'</a>'}
function setExp(k,v){S.exp[cd]=S.exp[cd]||{};S.exp[cd][k]=v===''?0:+v;save();drawSm()}
function waLink(s){return'https://wa.me/?text='+encodeURIComponent(S.shop+'\n'+dlabel(cd)+' ('+DN[new Date(cd+'T00:00:00').getDay()]+')\n'+TR('एंट्री:')+' '+s.n+'\n'+TR('कुल बिक्री:')+' '+inr(s.t)+'\n'+TR('कुल मुनाफ़ा:')+' '+inr(s.p)+'\n'+TR('कुल ख़र्च:')+' '+inr(s.x)+'\n'+TR('फ़ाइनल नेट प्रॉफ़िट:')+' '+inr(s.net))}

function openRow(id){
 var r=id?S.rows.find(function(x){return x.id===id}):{m:'',cost:'',sale:'',svc:''};
 sheet('<h3>'+(id?''+TR('एंट्री बदलें')+'':''+TR('नई एंट्री')+'')+'</h3><p class="mu">'+TR('सिर्फ़ दो चीज़ें लिखिए: कितने में लाए और कितने में बेची। बाक़ी हिसाब अपने-आप होगा।')+'</p>'+
 '<div class="fld"><label class="l" for="m">'+TR('ग्राहक / मोबाइल मॉडल')+'</label><input id="m" value="'+esc(r.m)+'" placeholder="'+TR('जैसे')+' Redmi Note 10" oninput="pv()">'+
 '<label class="l" for="c">'+TR('डिस्प्ले कितने में लाए (')+'₹)</label><input id="c" type="number" inputmode="decimal" min="0" value="'+r.cost+'" oninput="pv()">'+
 '<label class="l" for="s">'+TR('कितने में बेची (')+'₹)</label><input id="s" type="number" inputmode="decimal" min="0" value="'+r.sale+'" oninput="pv()">'+
 '<label class="l" for="v">'+TR('सर्विस चार्ज, अलग से लिया हो तो (')+'₹)</label><input id="v" type="number" inputmode="decimal" min="0" value="'+(r.svc||'')+'" placeholder="0" oninput="pv()"></div>'+
 '<div class="pv" id="pv"></div><div class="er" id="er" role="alert"></div><button class="btn" onclick="saveRow('+(id||'')+')">'+TR('सेव करें')+'</button>'+(id?'<button class="btn rd" onclick="delRow('+id+')">'+TR('यह एंट्री हटाएँ')+'</button>':'')+'<button class="btn gh" onclick="closeSheet()">'+TR('रद्द करें')+'</button>');
 pv()}
function pv(){var c=+$('c').value||0,s=+$('s').value||0,v=+$('v').value||0,p=s+v-c,e=$('pv');
 e.innerHTML=''+TR('कुल (')+'Total) '+inr(s+v)+' · '+TR('मुनाफ़ा')+' <span class="'+cl(p)+'">'+inr(p)+'</span>'}
function saveRow(id){
 var c=$('c').value,s=$('s').value,v=$('v').value;
 if(c===''||s===''||+c<0||+s<0||+v<0)return $('er').textContent='"'+TR('लाए')+'" '+TR('और')+' "'+TR('बेची')+'" '+TR('दोनों भाव लिखिए')+'';
 var o={m:$('m').value.trim(),cost:+c,sale:+s,svc:+v||0};
 if(id){Object.assign(S.rows.find(function(x){return x.id===id}),o)}else{o.id=S.nid++;o.d=cd;S.rows.push(o)}
 save();closeSheet();render()}
function delRow(id){if(confirm(''+TR('यह एंट्री हटाएँ?')+'')){S.rows=S.rows.filter(function(x){return x.id!==id});save();closeSheet();render()}}

function vMonth(){
 var a=mo.split('-'),days={};
 S.rows.forEach(function(r){if(r.d.indexOf(mo)===0)days[r.d]=1});Object.keys(S.exp).forEach(function(d){if(d.indexOf(mo)===0)days[d]=1});
 var k=Object.keys(days).sort().reverse(),T={n:0,t:0,p:0,x:0,net:0};
 var L=k.map(function(d){var s=dsum(d);T.n+=s.n;T.t+=s.t;T.p+=s.p;T.x+=s.x;T.net+=s.net;return'<div class="sr"><span>'+(+d.slice(8))+' '+MN[+d.slice(5,7)-1]+' <span class="mu">'+s.n+' '+TR('डिस्प्ले')+'</span></span><b class="'+cl(s.net)+'">'+inr(s.net)+'</b></div>'}).join('');
 return'<div class="mn"><button aria-label="'+TR('पिछला महीना')+'" onclick="mshift(-1)">‹</button><b>'+MN[+a[1]-1]+' '+a[0]+'</b><button aria-label="'+TR('अगला महीना')+'" onclick="mshift(1)">›</button></div>'+
 '<div class="fin '+(T.net>=0?'p':'l')+'"><small>'+TR('इस महीने का नेट प्रॉफ़िट')+'</small><b>'+inr(T.net)+'</b><span>'+(k.length?(T.net>=0?''+TR('इस महीने मुनाफ़ा हुआ')+'':''+TR('इस महीने नुक़सान हुआ')+''):''+TR('इस महीने कोई एंट्री नहीं')+'')+'</span></div>'+
 '<div class="card"><div class="sr"><span>'+TR('कुल डिस्प्ले बदली')+'</span><b>'+T.n+'</b></div><div class="sr"><span>'+TR('कुल बिक्री')+'</span><b>'+inr(T.t)+'</b></div><div class="sr"><span>'+TR('कुल मुनाफ़ा')+'</span><b class="pos">'+inr(T.p)+'</b></div><div class="sr"><span>'+TR('कुल ख़र्च')+'</span><b class="neg">'+inr(T.x)+'</b></div></div>'+
 '<h2>'+TR('दिन के हिसाब से (नेट प्रॉफ़िट)')+'</h2><div class="card">'+(L||'<span class="mu">'+TR('कोई एंट्री नहीं।')+'</span>')+'</div>'}
function mshift(n){var a=mo.split('-'),d=new Date(+a[0],+a[1]-1+n,1);mo=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render()}

function vSet(){
 return'<div class="card"><label class="l" for="shn" style="margin-top:0">'+TR('दुकान का नाम (ऊपर दिखेगा)')+'</label><div class="fld"><input id="shn" value="'+esc(S.shop)+'" oninput="S.shop=this.value;save();$(\'sn\').innerHTML=nm()"></div></div>'+
 '<h2>'+TR('बैकअप')+'</h2><div class="card"><p class="mu">'+TR('हफ़्ते में एक बार बैकअप सेव करके')+' WhatsApp '+TR('पर ख़ुद को भेज दीजिए। फ़ोन बदलने पर हिसाब वापस आ जाएगा।')+'</p><button class="btn" onclick="backup()">💾 '+TR('बैकअप सेव करें')+'</button><label class="btn gh" style="display:block;text-align:center;cursor:pointer">📂 '+TR('बैकअप वापस डालें')+'<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>'+
 '<button class="btn rd" onclick="wipe()">'+TR('डेमो एंट्री हटाकर खाली शुरू करें')+'</button>'}
function backup(){var b=new Blob([JSON.stringify({app:'pb81',v:1,saved:ymd(new Date()),S:S})],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='pb81-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function restore(inp){var f=inp.files[0];inp.value='';if(!f)return;var r=new FileReader();
 r.onload=function(){var d;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||d.app!=='pb81'||!d.S||!Array.isArray(d.S.rows)||typeof d.S.exp!=='object')return alert(''+TR('यह बैकअप फ़ाइल सही नहीं है')+'');
  if(confirm(''+TR('अभी का सारा हिसाब हट जाएगा और')+' '+(d.saved||'')+' '+TR('के बैकअप का हिसाब आ जाएगा। आगे बढ़ें?')+'')){S=d.S;save();render()}};r.readAsText(f)}
function wipe(){if(confirm(''+TR('सारी एंट्री हटाकर खाली शुरू करें? पहले बैकअप ले लीजिए।')+'')){S={shop:S.shop,nid:1,rows:[],exp:{}};save();tab='r';render()}}
function nm(){var p=esc(S.shop).split(' ');return p.length>1?p[0]+'<span>'+p.slice(1).join(' ')+'</span>':p[0]}

var TABS=[['r','📒',''+TR('रजिस्टर')+''],['m','📅',''+TR('महीना')+''],['x','⚙️',''+TR('सेटिंग')+'']];
function render(){
 DN=DN0.map(function(x){return TR(x)});MN=MN0.map(function(x){return TR(x)});
 $('rb').textContent=TR('डिस्प्ले रिप्लेसमेंट और प्रॉफ़िट रजिस्टर');$('lh').className=LANG==='hi'?'on':'';$('lp').className=LANG==='pa'?'on':'';document.documentElement.lang=LANG==='pa'?'pa':'hi';
 $('sn').innerHTML=nm();
 $('nv').innerHTML=TABS.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render();scrollTo(0,0)"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 $('app').innerHTML=({r:vReg,m:vMonth,x:vSet})[tab]();
 if(tab==='r')drawSm()}
render();
</script>
</body>
</html>
