 h+='<div class="fin '+(s.net>=0?'p':'l')+'"><small>'+TR('दुकान का कुल नेट प्रॉफ़िट')+'</small><b>'+inr(s.net)+'</b><span>'+(s.net>=0?''+TR('आज आपको')+' '+inr(s.net)+' '+TR('का प्रॉफ़िट हुआ')+'':''+TR('आज')+' '+inr(-s.net)+' '+TR('का नुक़सान हुआ')+'')+'</span><div class="mu">'+TR('डिस्प्ले, सामान, नुक़सान और ख़र्च जोड़कर')+'</div></div>';
 h+=L.length?'<div class="al"><b>⚠️ '+TR('ये माल ख़त्म होने वाला है')+'</b>'+L.map(function(i){return'<div class="sr"><span>'+esc(i.n)+'</span><b>'+i.stock+' '+TR('बचे')+'</b></div>'}).join('')+'<a class="btn wa" target="_blank" rel="noopener" href="'+stWa(stAlertText(L))+'">WhatsApp '+TR('पर अलर्ट भेजें')+'</a></div>':'<div class="okb">✅ '+TR('सारा माल ठीक है')+'</div>';
 var K=[[''+TR('डिस्प्ले बदली')+'',a.n,''],[''+TR('डिस्प्ले का मुनाफ़ा')+'',inr(a.p),'pos'],[''+TR('सामान बिका (पीस)')+'',b.u,''],[''+TR('सामान का मुनाफ़ा')+'',inr(b.pr),'pos'],[''+TR('नुक़सान (टूटा/वापस)')+'',inr(b.ls),'neg'],[''+TR('कुल ख़र्च')+'',inr(a.x),'neg']];
 h+='<div class="grid">'+K.map(function(k){return'<div class="k"><small>'+k[0]+'</small><b class="'+k[2]+'">'+k[1]+'</b></div>'}).join('')+'</div>';
 return h+'<a class="btn wa" target="_blank" rel="noopener" href="'+waAll(s)+'">WhatsApp '+TR('पर आज का हिसाब भेजें')+'</a>'}
function vStock(){
 var I=S.st.items,E=S.st.log.filter(function(e){return e.d===cd}).reverse(),TY={s:''+TR('बिका')+'',i:''+TR('माल आया')+'',l:''+TR('नुक़सान')+''};
 return dateBar()+'<h2>'+TR('किस सामान की एंट्री करनी है?')+'</h2><div class="pr">'+I.map(function(i){return'<div class="p'+(i.stock<=i.min?' l':'')+'"><button class="pm" onclick="stOpen(\''+i.id+'\')">'+esc(i.n)+'<small>'+inr(i.price)+'</small><span class="s">'+TR('स्टॉक')+' '+i.stock+'</span></button><button class="ed" aria-label="'+TR('बदलें')+'" onclick="stItem(\''+i.id+'\')">✎</button></div>'}).join('')+'</div>'+
 '<button class="add" onclick="stItem()">+ '+TR('नया प्रोडक्ट जोड़ें')+'</button><h2>'+TR('इस दिन की एंट्री')+'</h2>'+
 (E.length?E.map(function(e){return'<div class="ent"><span class="b"><span class="m">'+esc(e.name)+' × '+e.qty+'</span><span class="g"><span>'+TY[e.type]+(e.note?' ('+esc(e.note)+')':'')+'</span></span></span><span class="r"><b class="'+(e.type==='l'?'neg':'')+'">'+(e.type==='s'?inr(e.qty*e.price):e.type==='l'?'−'+inr(e.qty*e.cost):'+'+e.qty)+'</b></span><button class="x" aria-label="'+TR('हटाएँ')+'" onclick="stDelE(\''+e.id+'\')">✕</button></div>'}).join(''):'<div class="card mu">'+TR('कोई एंट्री नहीं।')+'</div>')}
function stOpen(id,m){
 var i=stIt(id);m=m||'s';
 sheet('<h3>'+esc(i.n)+' <span class="mu">'+TR('स्टॉक')+' '+i.stock+'</span></h3><div class="seg">'+[['s',''+TR('बिका')+''],['i',''+TR('माल आया')+''],['l',''+TR('नुक़सान')+'']].map(function(x){return'<button class="'+(m===x[0]?'on':'')+'" onclick="stOpen(\''+id+'\',\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div><div class="fld"><label class="l" for="sq">'+TR('कितने पीस')+'</label><input id="sq" type="number" inputmode="numeric" min="1" value="1">'+
 (m==='s'?'<label class="l" for="sp">'+TR('बेचने का भाव (एक का)')+'</label><input id="sp" type="number" inputmode="decimal" value="'+i.price+'">':'')+(m==='i'?'<label class="l" for="sp">'+TR('ख़रीद भाव (एक का)')+'</label><input id="sp" type="number" inputmode="decimal" value="'+i.cost+'">':'')+
 (m==='l'?'<label class="l" for="snt">'+TR('कारण (टूटा, वापस, ख़राब)')+'</label><input id="snt" placeholder="'+TR('कारण लिखें')+'">':'')+'</div><div class="er" id="er" role="alert"></div><button class="btn" onclick="stSave(\''+id+'\',\''+m+'\')">'+TR('सेव करें')+'</button><button class="btn gh" onclick="closeSheet()">'+TR('रद्द करें')+'</button>')}
function stSave(id,m){
 var i=stIt(id),q=Math.floor(+$('sq').value),pe=$('sp'),p=pe?+pe.value:0,er=function(x){$('er').textContent=x};
 if(!(q>0))return er(''+TR('पीस सही लिखिए')+'');
 if(m!=='i'&&q>i.stock)return er(''+TR('स्टॉक में सिर्फ़')+' '+i.stock+' '+TR('पीस हैं')+'');
 if(pe&&(pe.value===''||p<0))return er(''+TR('भाव लिखिए')+'');
 S.st.log.push({id:Math.random().toString(36).slice(2),d:cd,type:m,item:id,name:i.n,qty:q,cost:m==='i'?p:i.cost,price:m==='s'?p:0,note:$('snt')?$('snt').value.trim():''});
 if(m==='i'){i.stock+=q;i.cost=p}else i.stock-=q;
 save();closeSheet();render();
 if(m!=='i'&&i.stock<=i.min)sheet('<h3>⚠️ '+esc(i.n)+': '+TR('सिर्फ़')+' '+i.stock+' '+TR('पीस बचे हैं')+'</h3><p class="mu">'+TR('जल्दी मँगवा लीजिए।')+'</p><a class="btn wa" target="_blank" rel="noopener" href="'+stWa(stAlertText([i]))+'">WhatsApp '+TR('पर अलर्ट भेजें')+'</a><button class="btn gh" onclick="closeSheet()">'+TR('ठीक है')+'</button>')}
function stDelE(id){var e=S.st.log.find(function(x){return x.id===id});if(!e||!confirm(''+TR('यह एंट्री हटाएँ? स्टॉक वापस ठीक हो जाएगा।')+''))return;
 var i=stIt(e.item);if(i)i.stock+=e.type==='i'?-e.qty:e.qty;S.st.log=S.st.log.filter(function(x){return x.id!==id});save();render()}
function stItem(id){
 var i=id?stIt(id):{n:'',cost:'',price:'',stock:0,min:2};
 sheet('<h3>'+(id?''+TR('प्रोडक्ट बदलें')+'':''+TR('नया प्रोडक्ट')+'')+'</h3><div class="fld"><label class="l" for="in">'+TR('नाम')+'</label><input id="in" value="'+esc(i.n)+'"><label class="l" for="ic">'+TR('ख़रीद भाव (एक का)')+'</label><input id="ic" type="number" inputmode="decimal" value="'+i.cost+'"><label class="l" for="ip">'+TR('बेचने का भाव (एक का)')+'</label><input id="ip" type="number" inputmode="decimal" value="'+i.price+'"><label class="l" for="is">'+TR('अभी स्टॉक (पीस)')+'</label><input id="is" type="number" inputmode="numeric" value="'+i.stock+'"><label class="l" for="im">'+TR('इतने बचने पर अलर्ट')+'</label><input id="im" type="number" inputmode="numeric" value="'+i.min+'"></div><div class="er" id="er" role="alert"></div>'+
 '<button class="btn" onclick="stItemSave('+(id?'\''+id+'\'':'')+')">'+TR('सेव करें')+'</button>'+(id?'<button class="btn rd" onclick="stItemDel(\''+id+'\')">'+TR('यह प्रोडक्ट हटाएँ')+'</button>':'')+'<button class="btn gh" onclick="closeSheet()">'+TR('रद्द करें')+'</button>')}
function stItemSave(id){
 var n=$('in').value.trim(),c=+$('ic').value,p=+$('ip').value,s=Math.floor(+$('is').value),m=Math.floor(+$('im').value);
 if(!n)return $('er').textContent=''+TR('नाम लिखिए')+'';
 if($('ic').value===''||$('ip').value===''||c<0||p<0||s<0||m<0)return $('er').textContent=''+TR('भाव और पीस सही लिखिए')+'';
 var i=id?stIt(id):{id:'p'+Math.random().toString(36).slice(2,7)};i.n=n;i.cost=c;i.price=p;i.stock=s;i.min=m;if(!id)S.st.items.push(i);save();closeSheet();render()}
function stItemDel(id){if(confirm(''+TR('प्रोडक्ट हटाएँ? पुराना हिसाब बना रहेगा।')+'')){S.st.items=S.st.items.filter(function(i){return i.id!==id});save();closeSheet();render()}}
function vMonth(){
 var a=mo.split('-'),days={};
 S.rows.forEach(function(r){if(r.d.indexOf(mo)===0)days[r.d]=1});Object.keys(S.exp).forEach(function(d){if(d.indexOf(mo)===0)days[d]=1});S.st.log.forEach(function(e){if(e.d.indexOf(mo)===0)days[e.d]=1});
 var k=Object.keys(days).sort().reverse(),M={dn:0,dp:0,bu:0,bp:0,ls:0,x:0,net:0};
 var L=k.map(function(d){var s=tsum(d);M.dn+=s.a.n;M.dp+=s.a.p;M.bu+=s.b.u;M.bp+=s.b.pr;M.ls+=s.b.ls;M.x+=s.a.x;M.net+=s.net;return'<div class="sr"><span>'+(+d.slice(8))+' '+MN[+d.slice(5,7)-1]+'</span><b class="'+cl(s.net)+'">'+inr(s.net)+'</b></div>'}).join('');
 return'<div class="mn"><button aria-label="'+TR('पिछला महीना')+'" onclick="mshift(-1)">‹</button><b>'+MN[+a[1]-1]+' '+a[0]+'</b><button aria-label="'+TR('अगला महीना')+'" onclick="mshift(1)">›</button></div>'+
 '<div class="fin '+(M.net>=0?'p':'l')+'"><small>'+TR('इस महीने का नेट प्रॉफ़िट')+'</small><b>'+inr(M.net)+'</b><span>'+(k.length?(M.net>=0?''+TR('इस महीने मुनाफ़ा हुआ')+'':''+TR('इस महीने नुक़सान हुआ')+''):''+TR('इस महीने कोई एंट्री नहीं')+'')+'</span></div>'+
 '<div class="card"><div class="sr"><span>'+TR('कुल डिस्प्ले बदली')+'</span><b>'+M.dn+'</b></div><div class="sr"><span>'+TR('डिस्प्ले का मुनाफ़ा')+'</span><b class="pos">'+inr(M.dp)+'</b></div><div class="sr"><span>'+TR('सामान बिका (पीस)')+'</span><b>'+M.bu+'</b></div><div class="sr"><span>'+TR('सामान का मुनाफ़ा')+'</span><b class="pos">'+inr(M.bp)+'</b></div><div class="sr"><span>'+TR('नुक़सान')+'</span><b class="neg">'+inr(M.ls)+'</b></div><div class="sr"><span>'+TR('कुल ख़र्च')+'</span><b class="neg">'+inr(M.x)+'</b></div></div>'+
 '<h2>'+TR('दिन के हिसाब से (नेट प्रॉफ़िट)')+'</h2><div class="card">'+(L||'<span class="mu">'+TR('कोई एंट्री नहीं।')+'</span>')+'</div>'}
function mshift(n){var a=mo.split('-'),d=new Date(+a[0],+a[1]-1+n,1);mo=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render()}

function vSet(){
 return'<div class="card"><label class="l" for="shn" style="margin-top:0">'+TR('दुकान का नाम (ऊपर दिखेगा)')+'</label><div class="fld"><input id="shn" value="'+esc(S.shop)+'" oninput="S.shop=this.value;save();$(\'sn\').innerHTML=nm()"></div></div>'+
 '<div class="card"><label class="l" for="shp" style="margin-top:0">'+TR('आपका')+' WhatsApp '+TR('नंबर (माल के अलर्ट के लिए)')+'</label><div class="fld"><input id="shp" inputmode="numeric" maxlength="10" placeholder="10 '+TR('अंक')+'" value="'+esc(S.ph||'')+'" oninput="this.value=this.value.replace(/\\D/g,\'\');S.ph=this.value;save()"></div></div>'+
 '<h2>'+TR('बैकअप')+'</h2><div class="card"><p class="mu">'+TR('हफ़्ते में एक बार बैकअप सेव करके')+' WhatsApp '+TR('पर ख़ुद को भेज दीजिए। फ़ोन बदलने पर हिसाब वापस आ जाएगा।')+'</p><button class="btn" onclick="backup()">💾 '+TR('बैकअप सेव करें')+'</button><label class="btn gh" style="display:block;text-align:center;cursor:pointer">📂 '+TR('बैकअप वापस डालें')+'<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>'+
 '<button class="btn rd" onclick="wipe()">'+TR('डेमो एंट्री हटाकर खाली शुरू करें')+'</button>'}
function backup(){var b=new Blob([JSON.stringify({app:'pb81',v:1,saved:ymd(new Date()),S:S})],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='pb81-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function restore(inp){var f=inp.files[0];inp.value='';if(!f)return;var r=new FileReader();
 r.onload=function(){var d;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||d.app!=='pb81'||!d.S||!Array.isArray(d.S.rows)||typeof d.S.exp!=='object')return alert(''+TR('यह बैकअप फ़ाइल सही नहीं है')+'');
  if(confirm(''+TR('अभी का सारा हिसाब हट जाएगा और')+' '+(d.saved||'')+' '+TR('के बैकअप का हिसाब आ जाएगा। आगे बढ़ें?')+'')){S=d.S;ensure();save();render()}};r.readAsText(f)}
function wipe(){if(confirm(''+TR('सारी एंट्री हटाकर खाली शुरू करें? पहले बैकअप ले लीजिए।')+'')){S={shop:S.shop,ph:S.ph,nid:1,rows:[],exp:{},st:{items:[],log:[]}};save();tab='r';render()}}
function nm(){var p=esc(S.shop).split(' ');return p.length>1?p[0]+'<span>'+p.slice(1).join(' ')+'</span>':p[0]}

var TABS=[['t','🏠',''+TR('आज')+''],['r','📒',''+TR('रजिस्टर')+''],['s','📦',''+TR('माल')+''],['m','📅',''+TR('महीना')+''],['x','⚙️',''+TR('सेटिंग')+'']];
function render(){
 DN=DN0.map(function(x){return TR(x)});MN=MN0.map(function(x){return TR(x)});
 $('rb').textContent=TR('डिस्प्ले रिप्लेसमेंट और प्रॉफ़िट रजिस्टर');$('lh').className=LANG==='hi'?'on':'';$('lp').className=LANG==='pa'?'on':'';document.documentElement.lang=LANG==='pa'?'pa':'hi';
 $('sn').innerHTML=nm();
 $('nv').innerHTML=TABS.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render();scrollTo(0,0)"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 $('app').innerHTML=({t:vToday,r:vReg,s:vStock,m:vMonth,x:vSet})[tab]();
 if(tab==='r')drawSm()}
render();
</script>
</body>
